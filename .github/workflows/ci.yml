name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python tests (offscreen, offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install offscreen Qt and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon0
          python -m pip install PyQt6==6.11.0 PyQt6-Qt6==6.11.0 pytest Pillow
      - name: Compile Python sources
        run: python -m py_compile *.py
      - name: Run all tests without a display or network
        # A network namespace blocks both Python sockets and Qt's native networking.
        run: sudo unshare --net env QT_QPA_PLATFORM=offscreen SCREENBOT_RASTER_ARTIFACTS=raster-failures "$(command -v python)" -m pytest tests -v --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-test-results
          path: |
            test-results.xml
            raster-failures/

  kcm:
    name: Qt 6 / KDE Frameworks 6 build
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 20
    steps:
      - name: Install Qt 6 and KDE Frameworks 6 build dependencies
        run: pacman -Syu --noconfirm --needed base-devel git cmake extra-cmake-modules qt6-declarative kcmutils kcoreaddons ki18n
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure KDE settings module
        run: cmake -S kcm -B build
      - name: Build KDE settings module
        run: cmake --build build --parallel 2

  plasma-e2e:
    name: Install → idle trigger → uninstall (KDE Plasma 6)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Plasma 6 runtime and build dependencies
        run: |
          exec > >(tee /tmp/plasma-bootstrap.log) 2>&1
          pacman -Syu --noconfirm --needed base-devel git cmake extra-cmake-modules \
            qt6-declarative qt6-tools kcmutils kcoreaddons ki18n kconfig \
            kwin powerdevil dbus mesa python python-pyqt6 python-pip python-gobject util-linux libcap
          python -m venv --system-site-packages /opt/plasma-test
          /opt/plasma-test/bin/pip install python-dbusmock==0.38.1
          # Arch gives KWin cap_sys_nice=ep; Docker excludes it from the bounding
          # set and rejects exec with EPERM. Virtual KWin needs no elevated priority.
          getcap "$(command -v kwin_wayland)"
          setcap -r "$(command -v kwin_wayland)"
          test -z "$(getcap "$(command -v kwin_wayland)")"
          useradd --create-home ci
          runuser -u ci -- env QT_QPA_PLATFORM=offscreen kwin_wayland --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare user workspace and evidence
        run: |
          mkdir -p evidence
          chown -R ci:ci "$GITHUB_WORKSPACE"
          pacman -Q kwin powerdevil qt6-tools python python-pyqt6 mesa > evidence/packages.txt
      - name: Installer lifecycle
        run: runuser -u ci -- bash -o pipefail -c 'bash tests/test_installer.sh evidence/installer 2>&1 | tee evidence/installer.log'
      - name: Python interpreter selection
        if: ${{ !cancelled() }}
        run: runuser -u ci -- bash -o pipefail -c 'bash tests/test_python_runtime.sh evidence/python-runtime 2>&1 | tee evidence/python-runtime.log'
      - name: Real Wayland idle trigger and uninstall
        if: ${{ !cancelled() }}
        run: |
          runuser -u ci -- env SCREENBOT_PYTHON=/opt/plasma-test/bin/python \
            SCREENBOT_IDLE_MAX_SECONDS=90 bash -o pipefail -c \
            'bash tests/test_idle_trigger_wayland.sh evidence/idle-wayland 2>&1 | tee evidence/idle-wayland.log'
      - name: Collect bootstrap evidence
        if: always()
        run: |
          mkdir -p evidence
          cp /tmp/plasma-bootstrap.log evidence/bootstrap.log
      - name: Upload Plasma lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plasma-e2e-evidence
          path: evidence/
          if-no-files-found: error
