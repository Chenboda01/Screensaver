  <rect x="88" y="108" width="28" height="31" rx="12" fill="#168eb7" filter="url(#glow)"/>
  <rect x="140" y="108" width="28" height="31" rx="12" fill="#168eb7" filter="url(#glow)"/>
  <path d="M105 157q23 22 46 0" fill="none" stroke="#397b99" stroke-width="6" stroke-linecap="round"/>
