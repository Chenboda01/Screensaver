<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">ScreenBot icon</title>
  <desc id="desc">A friendly floating robot head with cyan eyes and antennae.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10243e"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2=".9" y2="1">
      <stop stop-color="#f6fbff"/>
      <stop offset="1" stop-color="#b9d5e8"/>
    </linearGradient>
    <filter id="glow" x="-.5" y="-.5" width="2" height="2">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="66" fill="url(#bg)"/>
